# TTL in ms of the cached ApplicationEventListener list in InMemoryApplicationEventProducer.
# 0 (default) disables caching: components may register/unregister at runtime (OSGi lifecycle,
# test runtimes) and a cache would delay their visibility. A small positive value trades bounded
# staleness for one registry lookup per dispatched domain event on the CRUD hot path.
water.events.listeners.cache.ttl.ms=${env:WATER_EVENTS_LISTENERS_CACHE_TTL_MS:-0}

water.traffic.enabled=${env:WATER_TRAFFIC_ENABLED:-false}
water.traffic.publisher.type=${env:WATER_TRAFFIC_PUBLISHER_TYPE:-memory}
water.traffic.publisher.queue.size=${env:WATER_TRAFFIC_PUBLISHER_QUEUE_SIZE:-10000}
water.traffic.publisher.overflow.policy=${env:WATER_TRAFFIC_PUBLISHER_OVERFLOW_POLICY:-drop}
# Service-to-Service capture. OPT-OUT: once enabled, every method a component exposes through its
# interfaces is reported (never a class's internals: the goal is the flow between components).
# Exclude specific methods with @NoTraffic at the source, or with the prefix list below
# (comma separated, "fully.qualified.ClassName" or "fully.qualified.ClassName#method").
water.traffic.s2s.enabled=${env:WATER_TRAFFIC_S2S_ENABLED:-false}
water.traffic.s2s.exclude=${env:WATER_TRAFFIC_S2S_EXCLUDE:-}

water.traffic.events.enabled=${env:WATER_TRAFFIC_EVENTS_ENABLED:-true}
water.traffic.events.mode=${env:WATER_TRAFFIC_EVENTS_MODE:-opt-in}
water.traffic.events.whitelist=${env:WATER_TRAFFIC_EVENTS_WHITELIST:-}
water.traffic.rest.enabled=${env:WATER_TRAFFIC_REST_ENABLED:-true}
water.traffic.rest.exclude=${env:WATER_TRAFFIC_REST_EXCLUDE:-}
water.traffic.sampling.rate=${env:WATER_TRAFFIC_SAMPLING_RATE:-1.0}
water.traffic.sampling.scope=${env:WATER_TRAFFIC_SAMPLING_SCOPE:-per-type}
water.traffic.payload.capture=${env:WATER_TRAFFIC_PAYLOAD_CAPTURE:-false}
water.traffic.service.name=${env:WATER_TRAFFIC_SERVICE_NAME:-}
