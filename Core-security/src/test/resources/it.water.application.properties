water.keystore.password=water.
water.keystore.alias=server-cert
water.keystore.file=src/test/resources/certs/server.keystore
water.private.key.password=water.

# Named keystores (EncryptionUtil.getKeyPairByAlias(keystoreName, alias))
# PKCS12 (default type of named keystores) and key.password falling back to the keystore password
water.keystore.kek.file=src/test/resources/certs/kek-test.p12
water.keystore.kek.password=kektest
# JKS file with no type: still loads thanks to the JDK compat mode (backward compatibility with the old JKS default)
water.keystore.kekjksdefault.file=src/test/resources/certs/kek-test.keystore
water.keystore.kekjksdefault.password=kektest
# JKS, explicit type and explicit key password, location resolved from the classpath
water.keystore.kekcp.file=classpath:certs/kek-test.keystore
water.keystore.kekcp.password=kektest
water.keystore.kekcp.key.password=kektest
water.keystore.kekcp.type=JKS
# PKCS12
water.keystore.kekp12.file=src/test/resources/certs/kek-test.p12
water.keystore.kekp12.password=kektest
water.keystore.kekp12.type=PKCS12
# wrong keystore password
water.keystore.badpwd.file=src/test/resources/certs/kek-test.p12
water.keystore.badpwd.password=wrong-password
# wrong key password (keystore password is right); with PKCS12 it may already fail while loading the store
water.keystore.badkeypwd.file=src/test/resources/certs/kek-test.p12
water.keystore.badkeypwd.password=kektest
water.keystore.badkeypwd.key.password=wrong-password
# PKCS12 holding secret key entries (hmac = HmacSHA256 256 bit, aes = AES-256), no type: PKCS12 default
water.keystore.hmac.file=src/test/resources/certs/hmac-test.p12
water.keystore.hmac.password=kektest
# same file, wrong keystore password
water.keystore.hmacbadpwd.file=src/test/resources/certs/hmac-test.p12
water.keystore.hmacbadpwd.password=wrong-password
# file configured but password missing
water.keystore.nopwd.file=src/test/resources/certs/kek-test.keystore
# classpath location that does not exist
water.keystore.nofile.file=classpath:certs/does-not-exist.keystore
water.keystore.nofile.password=kektest



